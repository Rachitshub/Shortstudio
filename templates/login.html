{% extends "base.html" %}

{% block title %}
Admin Login
{% endblock %}

{% block content %}

<div class="login-container">

    <h1>🔐 Admin Login</h1>

    <form action="/login" method="POST">

        <div class="form-group">
            <label>Username</label>
            <input
                type="text"
                name="username"
                placeholder="Enter Username"
                required
            >
        </div>

        <div class="form-group">
            <label>Password</label>
            <input
                type="password"
                name="password"
                placeholder="Enter Password"
                required
            >
        </div>

        <button type="submit">
            Login
        </button>

    </form>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

</div>

{% endblock %}
